<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style> 
     #map { height: 180px;}

 
     </style>
</head>
<body>
    
    <h1>Basic Maps</h1>
  <div id = "map" ></div>

  
</body> 

<script>

var map = L.map ('map') .setView ([8.360179443790004, 124.86812445320841], 17 ) ;

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 25,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);


var marker = L.marker([8.360179443790004, 124.86812445320841], 17 )     .addTo(map);
const dogeImage = "<img src='https://static01.nyt.com/images/2020/01/28/multimedia/28xp-memekid3/28cp-memekid3-articleLarge.jpg?quality=75&auto=webp&disable=upscale' class='popup-image' >";   
const popupContent = `${dogeImage}<br><b>Hello World</b><br>I am a popup` ;

marker.bindPopup(popupContent).openPopup();

function initMap(mapDataUrl) {}


var map = L.map ('map') .setView ([8.360179443790004, 124.86812445320841], 17 ) ;

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 25,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

console.log("Map loaded" + Date()) ;    

    fetch(mapDataUrl)
        .then(response => response.json())
        .then(data =>{
            data.forEach(pin=>{
                const marker = L.marker([pin.lat,pin.lng]).addTo(map);
                const img = `<img src='${pin.img}' class="popup-image">`;
                marker.bindPopup(`${img}<br><b> ${pin.title} </b><br> ${pin.description}`);
                
                console.log(`${pin.name} Loaded ` +Date());
            });
        })
        .catch(err=>console.error('Error loading JSON:',err));


document.addEventListener('DOMContentLoaded',()=>{
    initMap('maps.json');
})

    

</script>
</html>
